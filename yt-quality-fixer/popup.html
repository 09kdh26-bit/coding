<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 180px; padding: 15px; margin: 0; background-color: #f9f9f9; }
    h4 { margin: 0 0 10px 0; font-size: 14px; text-align: center; }
    select { width: 100%; padding: 6px; font-size: 13px; border-radius: 4px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h4>목표 화질 설정</h4>
  <select id="qualitySelect">
    <option value="hd2160">4K (2160p)</option>
    <option value="hd1440">1440p</option>
    <option value="hd1080">1080p</option>
    <option value="hd720">720p</option>
    <option value="large">480p</option>
    <option value="medium">360p</option>
    <option value="small">240p</option>
    <option value="tiny">144p</option>
  </select>
  <script src="popup.js"></script>
</body>
</html>
